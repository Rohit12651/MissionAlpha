<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Devin Study Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Hallmark · macrostructure: Workbench (app shell, studied product IA) · tone: technical · genre: modern-minimal
 * theme: studied-DNA (source: app.devin.ai walkthrough 2026-10-12) · paper oklch(16% 0.006 260) · accent oklch(72% 0.13 235)
 * fonts: Inter (UI) + JetBrains Mono (shell/code) · nav: sidebar workbench · footer: none (app)
 * motion: emil-design-eng — press scale .97, ease-out menus <=200ms, no animation on keyboard (Cmd+K) actions
 * pre-emit critique: P4 H4 E4 S5 R4 V4
 * Research mockup: simulated data, not affiliated with Cognition. Built from public docs + a logged-in walkthrough.
 */
:root{
  color-scheme: dark;
  --color-paper: oklch(16% 0.006 260);
  --color-paper-2: oklch(19.5% 0.007 260);
  --color-paper-3: oklch(23% 0.008 260);
  --color-paper-4: oklch(28% 0.009 260);
  --color-ink: oklch(94% 0.004 260);
  --color-ink-2: oklch(78% 0.006 260);
  --color-ink-3: oklch(60% 0.008 260);
  --color-hair: oklch(100% 0 0 / .08);
  --color-hair-2: oklch(100% 0 0 / .14);
  --color-accent: oklch(72% 0.13 235);
  --color-accent-soft: oklch(72% 0.13 235 / .14);
  --color-ok: oklch(74% 0.14 155);
  --color-ok-soft: oklch(74% 0.14 155 / .14);
  --color-warn: oklch(80% 0.13 80);
  --color-warn-soft: oklch(80% 0.13 80 / .14);
  --color-bad: oklch(68% 0.17 25);
  --color-bad-soft: oklch(68% 0.17 25 / .14);
  --color-violet: oklch(72% 0.12 300);
  --color-focus: oklch(80% 0.12 235);
  --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --text-xs: .75rem; --text-sm: .8125rem; --text-md: .875rem; --text-lg: 1rem; --text-xl: 1.25rem; --text-2xl: 1.75rem;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px;
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px; --radius-pill: 999px;
  --ease-out: cubic-bezier(.23,1,.32,1);
  --ease-in-out: cubic-bezier(.77,0,.175,1);
  --ease-drawer: cubic-bezier(.32,.72,0,1);
  --dur-press: 140ms; --dur-menu: 180ms; --dur-panel: 260ms;
  --sidebar: 248px;
}
@media (prefers-color-scheme: light){
  :root{
    color-scheme: light;
    --color-paper: oklch(98.5% 0.002 260); --color-paper-2: oklch(96% 0.003 260); --color-paper-3: oklch(93% 0.004 260); --color-paper-4: oklch(88% 0.005 260);
    --color-ink: oklch(20% 0.006 260); --color-ink-2: oklch(38% 0.008 260); --color-ink-3: oklch(52% 0.008 260);
    --color-hair: oklch(0% 0 0 / .08); --color-hair-2: oklch(0% 0 0 / .15);
    --color-accent: oklch(52% 0.14 245); --color-accent-soft: oklch(52% 0.14 245 / .1);
    --color-ok: oklch(52% 0.13 155); --color-warn: oklch(58% 0.13 70); --color-bad: oklch(55% 0.18 25); --color-focus: oklch(52% 0.14 245);
  }
}
*{box-sizing:border-box}
html,body{overflow-x:clip;height:100%}
body{margin:0;background:var(--color-paper);color:var(--color-ink);font:400 var(--text-md)/1.5 var(--font-ui);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--color-accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--color-focus);outline-offset:2px;border-radius:4px}
code,pre,.mono{font-family:var(--font-mono);font-size:.8125rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);height:100dvh}
.side{background:var(--color-paper-2);border-right:1px solid var(--color-hair);display:flex;flex-direction:column;min-height:0}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:var(--space-3) var(--space-3) var(--space-2)}
.org{display:flex;gap:var(--space-2);align-items:center;font-weight:600;padding:var(--space-1) var(--space-2);border-radius:var(--radius-sm)}
.mark{width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,var(--color-accent),var(--color-violet));display:grid;place-items:center;font:600 11px var(--font-mono);color:var(--color-paper)}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 var(--space-2)}
.nav a,.side-btn{display:flex;align-items:center;gap:var(--space-2);padding:6px var(--space-2);border-radius:var(--radius-sm);color:var(--color-ink-2);text-decoration:none;font-size:var(--text-md);border:0;background:none;cursor:pointer;width:100%;text-align:left}
.nav a:hover,.side-btn:hover{background:var(--color-paper-3);color:var(--color-ink);text-decoration:none}
.nav a[aria-current="page"]{background:var(--color-paper-3);color:var(--color-ink)}
.nav svg,.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side-label{display:flex;justify-content:space-between;align-items:center;padding:var(--space-4) var(--space-4) var(--space-1);font-size:var(--text-xs);color:var(--color-ink-3);font-weight:500}
.sess-list{flex:1;overflow:auto;padding:0 var(--space-2) var(--space-2);min-height:0}
.sess-item{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:var(--space-2);align-items:center;padding:6px var(--space-2);border-radius:var(--radius-sm);color:var(--color-ink-2);font-size:var(--text-sm);text-decoration:none}
.sess-item:hover{background:var(--color-paper-3);text-decoration:none;color:var(--color-ink)}
.sess-item[aria-current="page"]{background:var(--color-paper-3);color:var(--color-ink)}
.sess-item span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--color-ink-3)}
.dot.running{background:var(--color-accent);box-shadow:0 0 0 3px var(--color-accent-soft)}
.dot.waiting{background:var(--color-warn)}
.dot.finished{background:var(--color-ok)}
.dot.suspended{background:var(--color-ink-3);outline:1px dashed var(--color-ink-3);outline-offset:1px}
.dot.error{background:var(--color-bad)}
.side-foot{border-top:1px solid var(--color-hair);padding:var(--space-2);display:flex;flex-direction:column;gap:2px}
.quota{padding:var(--space-2);font-size:var(--text-xs);color:var(--color-ink-3)}
.bar{height:4px;border-radius:4px;background:var(--color-paper-4);overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:var(--color-accent);transform-origin:left;transition:transform var(--dur-panel) var(--ease-out)}
main{min-width:0;min-height:0;overflow:auto;position:relative}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-6);background:color-mix(in oklch,var(--color-paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--color-hair);min-height:52px}
.topbar h1{font-size:var(--text-lg);font-weight:600;margin:0}
.crumb{color:var(--color-ink-3);font-size:var(--text-sm)}
.spacer{flex:1}
.banner{font-size:var(--text-xs);color:var(--color-ink-3);border:1px solid var(--color-hair);border-radius:var(--radius-pill);padding:2px 10px}
.iconbtn.menu-toggle{display:none}
.page{padding:var(--space-6);max-width:1180px;margin:0 auto}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--color-hair-2);background:var(--color-paper-3);color:var(--color-ink);padding:6px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:var(--text-sm);font-weight:500;white-space:nowrap;transition:transform var(--dur-press) var(--ease-out),background-color var(--dur-menu) ease}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:var(--color-ink);color:var(--color-paper);border-color:transparent}
.btn.accent{background:var(--color-accent);color:oklch(18% 0.02 240);border-color:transparent}
.btn.ghost{background:none;border-color:transparent;color:var(--color-ink-2)}
.btn.danger{color:var(--color-bad)}
.btn.sm{padding:3px 8px;font-size:var(--text-xs)}
@media (hover:hover) and (pointer:fine){
  .btn:hover{background:var(--color-paper-4)}
  .btn.primary:hover{background:var(--color-ink-2)}
  .btn.accent:hover{filter:brightness(1.08)}
  .btn.ghost:hover{background:var(--color-paper-3);color:var(--color-ink)}
}
.btn[data-state="loading"]{pointer-events:none;opacity:.8}
.btn[data-state="loading"]::before{content:"";width:10px;height:10px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:var(--text-xs);padding:2px 8px;border-radius:var(--radius-pill);background:var(--color-paper-3);color:var(--color-ink-2);border:1px solid var(--color-hair);white-space:nowrap}
.chip.ok{background:var(--color-ok-soft);color:var(--color-ok);border-color:transparent}
.chip.warn{background:var(--color-warn-soft);color:var(--color-warn);border-color:transparent}
.chip.bad{background:var(--color-bad-soft);color:var(--color-bad);border-color:transparent}
.chip.acc{background:var(--color-accent-soft);color:var(--color-accent);border-color:transparent}
.seg{display:inline-flex;background:var(--color-paper-3);border-radius:var(--radius-pill);padding:2px}
.seg button{border:0;background:none;padding:3px 12px;border-radius:var(--radius-pill);font-size:var(--text-sm);color:var(--color-ink-3);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--color-paper-4);color:var(--color-ink)}
.input,textarea.input,select.input{width:100%;background:var(--color-paper-2);border:1px solid var(--color-hair-2);border-radius:var(--radius-sm);padding:7px 10px;color:var(--color-ink)}
.input:focus{outline:2px solid var(--color-focus);outline-offset:-1px}
.input[aria-invalid="true"]{border-color:var(--color-bad)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:var(--space-3)}
.field label{font-size:var(--text-xs);color:var(--color-ink-3);font-weight:500}
.field .err{font-size:var(--text-xs);color:var(--color-bad)}
.switch{position:relative;width:32px;height:18px;flex:none;border-radius:var(--radius-pill);background:var(--color-paper-4);border:0;cursor:pointer;transition:background-color var(--dur-menu) ease}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--color-ink);transition:transform var(--dur-menu) var(--ease-out)}
.switch[aria-checked="true"]{background:var(--color-accent)}
.switch[aria-checked="true"]::after{transform:translateX(14px)}
.card{background:var(--color-paper-2);border:1px solid var(--color-hair);border-radius:var(--radius-md);padding:var(--space-4)}
.tabs{display:flex;gap:var(--space-1);border-bottom:1px solid var(--color-hair);margin-bottom:var(--space-4);overflow-x:auto}
.tabs button,.tabs a{border:0;background:none;padding:8px 10px;color:var(--color-ink-3);font-size:var(--text-sm);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;text-decoration:none;white-space:nowrap}
.tabs [aria-selected="true"]{color:var(--color-ink);border-bottom-color:var(--color-ink)}
.row{display:flex;gap:var(--space-3);align-items:center}
.stack{display:flex;flex-direction:column;gap:var(--space-3)}
.muted{color:var(--color-ink-3)}
.small{font-size:var(--text-sm)}
.xs{font-size:var(--text-xs)}
h2{font-size:var(--text-xl);font-weight:600;margin:0 0 var(--space-1)}
h3{font-size:var(--text-lg);font-weight:600;margin:0}
.lede{color:var(--color-ink-3);margin:0 0 var(--space-5)}
table.t{width:100%;border-collapse:collapse;font-size:var(--text-sm)}
table.t th{text-align:left;font-weight:500;color:var(--color-ink-3);font-size:var(--text-xs);padding:8px;border-bottom:1px solid var(--color-hair)}
table.t td{padding:10px 8px;border-bottom:1px solid var(--color-hair);vertical-align:top}
.tablewrap{overflow-x:auto}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:var(--space-3)}
.empty{border:1px dashed var(--color-hair-2);border-radius:var(--radius-md);padding:var(--space-8);text-align:center;color:var(--color-ink-3)}

/* ---------- popover menu (origin-aware) ---------- */
.pop{position:fixed;z-index:50;min-width:220px;background:var(--color-paper-3);border:1px solid var(--color-hair-2);border-radius:var(--radius-md);padding:4px;box-shadow:0 12px 32px oklch(0% 0 0 / .35);transform-origin:var(--origin,top left);transition:opacity var(--dur-menu) var(--ease-out),transform var(--dur-menu) var(--ease-out)}
@starting-style{.pop{opacity:0;transform:scale(.96)}}
.pop .grp{font-size:var(--text-xs);color:var(--color-ink-3);padding:6px 8px 2px}
.pop button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:none;padding:6px 8px;border-radius:6px;cursor:pointer;text-align:left;font-size:var(--text-sm)}
.pop button:hover,.pop button:focus-visible{background:var(--color-paper-4);outline:0}
.pop button small{margin-left:auto;color:var(--color-ink-3)}

/* ---------- home composer ---------- */
.home{min-height:calc(100dvh - 52px);display:grid;place-items:center;padding:var(--space-6)}
.composer-wrap{width:min(720px,100%)}
.brandline{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-3)}
.brandline .wm{display:flex;gap:var(--space-2);align-items:center;font-size:var(--text-2xl);font-weight:600;letter-spacing:-.02em}
.composer{background:var(--color-paper-2);border:1px solid var(--color-hair-2);border-radius:var(--radius-lg);transition:border-color var(--dur-menu) ease}
.composer:focus-within{border-color:var(--color-ink-3)}
.composer textarea{width:100%;min-height:96px;resize:vertical;border:0;background:none;padding:var(--space-4);outline:0;line-height:1.5}
.composer-bar{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3) var(--space-3)}
.iconbtn{width:30px;height:30px;display:grid;place-items:center;border-radius:var(--radius-sm);border:0;background:none;color:var(--color-ink-2);cursor:pointer;transition:transform var(--dur-press) var(--ease-out)}
.iconbtn:hover{background:var(--color-paper-3);color:var(--color-ink)}
.iconbtn:active{transform:scale(.94)}
.send{width:32px;height:32px;border-radius:50%;border:0;background:var(--color-ink);color:var(--color-paper);display:grid;place-items:center;cursor:pointer;transition:transform var(--dur-press) var(--ease-out),opacity var(--dur-menu)}
.send:disabled{opacity:.35;cursor:not-allowed}
.send:not(:disabled):active{transform:scale(.92)}
.attached{display:flex;flex-wrap:wrap;gap:6px;padding:0 var(--space-4)}
.suggest{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-top:var(--space-4)}
.suggest button{border:1px solid var(--color-hair-2);background:none;border-radius:var(--radius-pill);padding:5px 12px;color:var(--color-ink-2);cursor:pointer;font-size:var(--text-sm);transition:transform var(--dur-press) var(--ease-out)}
.suggest button:hover{color:var(--color-ink);background:var(--color-paper-2)}
.suggest button:active{transform:scale(.97)}
.note{margin-top:var(--space-6);font-size:var(--text-xs);color:var(--color-ink-3);line-height:1.6}

/* ---------- session ---------- */
.session{display:grid;grid-template-columns:minmax(340px,42%) minmax(0,1fr);height:calc(100dvh - 52px)}
.chat{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--color-hair)}
.thread{flex:1;overflow:auto;padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-4);min-height:0}
.msg{display:flex;flex-direction:column;gap:6px;max-width:100%}
.msg .who{font-size:var(--text-xs);color:var(--color-ink-3);display:flex;gap:6px;align-items:center}
.msg.user .body{align-self:flex-end;background:var(--color-paper-3);padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);max-width:92%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user .who{align-self:flex-end}
.msg.devin .body{white-space:pre-wrap;overflow-wrap:anywhere}
.msg.enter{animation:msgIn 260ms var(--ease-out) both}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}}
.step{display:flex;gap:var(--space-2);align-items:flex-start;font-size:var(--text-sm);color:var(--color-ink-2)}
.step .ico{margin-top:2px}
.planbox{border:1px solid var(--color-hair-2);border-radius:var(--radius-md);padding:var(--space-3);background:var(--color-paper-2)}
.planbox ol{margin:6px 0 10px;padding-left:20px}
.prcard{border:1px solid var(--color-hair-2);border-radius:var(--radius-md);padding:var(--space-3);display:flex;flex-direction:column;gap:6px;background:var(--color-paper-2)}
.chatbox{border-top:1px solid var(--color-hair);padding:var(--space-3)}
.chatbox .composer textarea{min-height:56px;padding:var(--space-3)}
.statusline{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center;padding:var(--space-2) var(--space-5);border-bottom:1px solid var(--color-hair);font-size:var(--text-xs)}
.work{display:flex;flex-direction:column;min-height:0}
.work .tabs{margin:0;padding:0 var(--space-4)}
.pane{flex:1;overflow:auto;min-height:0;position:relative}
.pane-inner{padding:var(--space-4)}
.term{background:oklch(13% 0.006 260);color:oklch(88% 0.01 150);font-family:var(--font-mono);font-size:.78rem;line-height:1.6;padding:var(--space-4);min-height:100%;white-space:pre-wrap;overflow-wrap:anywhere}
.term .p{color:var(--color-accent)}
.term .e{color:var(--color-bad)}
.term .g{color:var(--color-ok)}
.prog-item{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:var(--space-2);padding:6px 0;border-bottom:1px solid var(--color-hair);font-size:var(--text-sm)}
.diff{font-family:var(--font-mono);font-size:.78rem;border:1px solid var(--color-hair);border-radius:var(--radius-sm);overflow:auto;margin-bottom:var(--space-3)}
.diff .fh{background:var(--color-paper-3);padding:6px 10px;display:flex;justify-content:space-between;gap:8px;font-family:var(--font-ui);font-size:var(--text-xs)}
.diff .l{display:grid;grid-template-columns:40px minmax(0,1fr);white-space:pre}
.diff .l span:first-child{color:var(--color-ink-3);text-align:right;padding-right:8px;user-select:none}
.diff .add{background:oklch(74% 0.14 155 / .1)}
.diff .del{background:oklch(68% 0.17 25 / .1)}
.browser{border:1px solid var(--color-hair);border-radius:var(--radius-md);overflow:hidden}
.browser .addr{display:flex;gap:8px;align-items:center;padding:6px 10px;background:var(--color-paper-3);font-size:var(--text-xs);color:var(--color-ink-3)}
.browser .viewport{background:oklch(97% 0.003 260);color:oklch(25% 0.01 260);min-height:260px;padding:var(--space-5);position:relative}
.fake-form{max-width:320px;display:flex;flex-direction:column;gap:8px;font-size:var(--text-sm)}
.fake-form .f{border:1px solid oklch(85% 0.005 260);border-radius:6px;padding:7px 9px;background:white;min-height:34px;transition:border-color 160ms}
.fake-form .f.on{border-color:oklch(55% 0.14 245)}
.fake-form .b{background:oklch(25% 0.01 260);color:white;border-radius:6px;padding:8px;text-align:center}
.cursor{position:absolute;width:14px;height:14px;border-radius:50%;background:oklch(60% 0.2 25 / .55);border:2px solid oklch(60% 0.2 25);transition:transform 600ms var(--ease-in-out);pointer-events:none}
.rec{display:inline-flex;gap:6px;align-items:center;font-size:var(--text-xs);color:var(--color-bad)}
.rec::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.children{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:var(--space-2)}
.child{border:1px solid var(--color-hair);border-radius:var(--radius-sm);padding:var(--space-2) var(--space-3);font-size:var(--text-sm);background:var(--color-paper-2)}

/* ---------- automation builder ---------- */
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-2);align-items:stretch}
.flow .node{border:1px solid var(--color-hair-2);border-radius:var(--radius-md);padding:var(--space-3);background:var(--color-paper-2);position:relative}
.flow .node .k{font-size:var(--text-xs);color:var(--color-ink-3);margin-bottom:4px}
.tpl{border:1px solid var(--color-hair);border-radius:var(--radius-md);padding:var(--space-3);display:flex;flex-direction:column;gap:6px;cursor:pointer;background:none;text-align:left;transition:transform var(--dur-press) var(--ease-out),border-color var(--dur-menu)}
.tpl:hover{border-color:var(--color-hair-2);background:var(--color-paper-2)}
.tpl:active{transform:scale(.985)}

/* ---------- swarm ---------- */
.swarm{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:6px;margin:var(--space-3) 0}
.agent{border:1px solid var(--color-hair);border-radius:var(--radius-sm);padding:6px 8px;font-size:var(--text-xs);display:flex;justify-content:space-between;gap:6px;background:var(--color-paper-2)}
.agent.run{border-color:var(--color-accent)}
.agent.done{border-color:transparent;background:var(--color-ok-soft)}
.phases{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:var(--space-3)}

/* ---------- wiki / memory ---------- */
.wiki{display:grid;grid-template-columns:220px minmax(0,1fr);gap:var(--space-5)}
.toc a{display:block;padding:4px 8px;border-radius:6px;color:var(--color-ink-2);font-size:var(--text-sm)}
.toc a[aria-current="true"]{background:var(--color-paper-3);color:var(--color-ink);text-decoration:none}
.wiki article p{max-width:68ch;color:var(--color-ink-2)}
.cite{font-family:var(--font-mono);font-size:var(--text-xs);background:var(--color-paper-3);padding:1px 6px;border-radius:4px;color:var(--color-accent);cursor:pointer;border:0}
.md{background:var(--color-paper-2);border:1px solid var(--color-hair);border-radius:var(--radius-sm);padding:var(--space-3);font-family:var(--font-mono);font-size:.78rem;white-space:pre-wrap;overflow-wrap:anywhere}
.files{display:flex;flex-direction:column;gap:2px}
.files button{text-align:left;border:0;background:none;padding:5px 8px;border-radius:6px;font-family:var(--font-mono);font-size:.78rem;color:var(--color-ink-2);cursor:pointer}
.files button[aria-current="true"]{background:var(--color-paper-3);color:var(--color-ink)}
.memgrid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:var(--space-4)}

/* ---------- settings ---------- */
.settings{display:grid;grid-template-columns:200px minmax(0,1fr);gap:var(--space-6)}
.setnav{display:flex;flex-direction:column;gap:2px}
.setnav .h{font-size:var(--text-xs);color:var(--color-ink-3);padding:var(--space-3) 8px 2px}
.setnav a{padding:5px 8px;border-radius:6px;color:var(--color-ink-2);font-size:var(--text-sm);text-decoration:none}
.setnav a[aria-current="page"]{background:var(--color-paper-3);color:var(--color-ink)}
.setrow{display:flex;justify-content:space-between;gap:var(--space-4);align-items:center;padding:var(--space-3) 0;border-bottom:1px solid var(--color-hair)}
.setrow .d{font-size:var(--text-xs);color:var(--color-ink-3)}
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:var(--space-3)}
.plan.cur{border-color:var(--color-accent)}

/* ---------- toast + palette + drawer ---------- */
.toasts{position:fixed;right:var(--space-4);bottom:var(--space-4);display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--color-paper-4);border:1px solid var(--color-hair-2);border-radius:var(--radius-md);padding:10px 14px;font-size:var(--text-sm);min-width:240px;max-width:360px;box-shadow:0 10px 30px oklch(0% 0 0 / .3);display:flex;gap:10px;align-items:center;transition:opacity 400ms ease,transform 400ms ease}
@starting-style{.toast{opacity:0;transform:translateY(100%)}}
.toast.out{opacity:0;transform:translateY(40%);transition-duration:200ms}
.palette-bg{position:fixed;inset:0;background:oklch(0% 0 0 / .45);z-index:70;display:grid;place-items:start center;padding-top:14vh}
.palette{width:min(560px,92vw);background:var(--color-paper-3);border:1px solid var(--color-hair-2);border-radius:var(--radius-lg);overflow:hidden}
.palette input{width:100%;border:0;background:none;padding:14px 16px;font-size:var(--text-lg);outline:0;border-bottom:1px solid var(--color-hair)}
.palette .res{max-height:320px;overflow:auto;padding:4px}
.palette .res button{display:flex;width:100%;gap:8px;border:0;background:none;padding:8px 12px;border-radius:6px;text-align:left;cursor:pointer;font-size:var(--text-sm)}
.palette .res button[aria-selected="true"]{background:var(--color-paper-4)}
.drawer-bg{position:fixed;inset:0;background:oklch(0% 0 0 / .4);z-index:65;transition:opacity var(--dur-panel) ease}
@starting-style{.drawer-bg{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--color-paper-2);border-left:1px solid var(--color-hair-2);z-index:66;display:flex;flex-direction:column;transition:transform 320ms var(--ease-drawer)}
@starting-style{.drawer{transform:translateX(100%)}}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:var(--space-4);border-bottom:1px solid var(--color-hair)}
.drawer .body{flex:1;overflow:auto;padding:var(--space-4)}

/* ---------- sidebar items + spaces ---------- */
.sess-item.two{grid-template-columns:minmax(0,1fr) auto;align-items:start;row-gap:2px}
.sess-item .meta{grid-column:1/-1;display:flex;gap:6px;align-items:center;font-size:var(--text-xs);color:var(--color-ink-3);min-width:0}
.space-grp{border:1px solid var(--color-hair-2);border-radius:var(--radius-md);margin:6px 0;background:var(--color-paper);padding-bottom:4px}
.space-grp > button{display:flex;width:100%;justify-content:space-between;border:0;background:none;padding:8px 10px;color:var(--color-ink-2);cursor:pointer;font-size:var(--text-sm)}
.unread{width:7px;height:7px;border-radius:50%;background:var(--color-accent);flex:none;margin-top:6px}
.working{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.sep-dot{width:4px;height:4px;border-radius:50%;background:var(--color-ink-3);flex:none}
.ico.pr-open{stroke:var(--color-ok)} .ico.pr-merged{stroke:var(--color-violet)} .ico.pr-closed{stroke:var(--color-bad)}

/* ---------- sessions board ---------- */
.fbar{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center;margin:var(--space-3) 0 var(--space-5);padding-bottom:var(--space-4);border-bottom:1px solid var(--color-hair)}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--color-hair-2);background:var(--color-paper);border-radius:var(--radius-pill);padding:4px 12px;font-size:var(--text-sm);color:var(--color-ink-2);cursor:pointer;transition:transform var(--dur-press) var(--ease-out)}
.fchip[data-on="true"]{background:var(--color-accent-soft);color:var(--color-accent);border-color:transparent}
.fchip:active{transform:scale(.97)}
.board{display:grid;grid-template-columns:repeat(3,minmax(250px,1fr));gap:var(--space-5);overflow-x:auto;padding-bottom:var(--space-2)}
.col-h{display:flex;align-items:center;gap:8px;padding:2px 2px var(--space-3);font-weight:500}
.col-h .n{color:var(--color-ink-3);font-weight:400}
.kcard{display:flex;flex-direction:column;gap:4px;min-height:96px;background:var(--color-paper-2);border:1px solid var(--color-hair);border-radius:var(--radius-md);padding:var(--space-3);color:var(--color-ink);text-decoration:none;margin-bottom:var(--space-2);transition:border-color var(--dur-menu) ease,transform var(--dur-press) var(--ease-out)}
.kcard:hover{border-color:var(--color-hair-2);text-decoration:none}
.kcard:active{transform:scale(.985)}
.kcard .sp{font-size:var(--text-xs);color:var(--color-ink-3)}
.kcard .tt{display:flex;justify-content:space-between;gap:8px;font-weight:500}
.kmeta{margin-top:auto;padding-top:var(--space-3);display:flex;align-items:center;gap:6px;font-size:var(--text-xs);color:var(--color-ink-3)}
td .kmeta{padding:0;margin:0}

/* ---------- review (split diff) ---------- */
.rv-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--color-hair);padding-bottom:var(--space-3);margin-bottom:var(--space-4)}
.rv{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:var(--space-5)}
.rv-sec{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.rv-sec .num{width:22px;height:22px;border:1px solid var(--color-hair-2);border-radius:6px;display:grid;place-items:center;font-size:var(--text-xs)}
.sfile{border:1px solid var(--color-hair);border-radius:var(--radius-sm);margin-bottom:var(--space-5);overflow:hidden}
.sfile .fhead{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--color-paper-2);font-size:var(--text-xs);border-bottom:1px solid var(--color-hair);flex-wrap:wrap}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);font-family:var(--font-mono);font-size:.75rem;line-height:1.55}
.split .c{display:grid;grid-template-columns:44px minmax(0,1fr);min-height:20px}
.split .c:nth-child(odd){border-right:1px solid var(--color-hair)}
.split .c > span:first-child{color:var(--color-ink-3);text-align:right;padding-right:8px;user-select:none}
.split .c > span:last-child{white-space:pre-wrap;overflow-wrap:anywhere;padding-right:8px}
.split .c.add{background:oklch(74% 0.14 155 / .14)}
.split .c.add > span:first-child{background:oklch(74% 0.14 155 / .26);color:var(--color-ink-2)}
.split .c.del{background:oklch(68% 0.17 25 / .12)}
.split .c.empty{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--color-hair) 6px 7px)}
.expander{grid-column:1/-1;display:flex;gap:var(--space-5);justify-content:center;background:var(--color-accent-soft);font-family:var(--font-ui);font-size:var(--text-xs);padding:3px}
.expander button{border:0;background:none;color:var(--color-accent);cursor:pointer}
.rv-side{border-left:1px solid var(--color-hair);padding-left:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);font-size:var(--text-sm);align-self:start;position:sticky;top:64px}
.rv-block{border:1px solid var(--color-hair);border-radius:var(--radius-sm);padding:8px 10px}
.rv-block > button.h{display:flex;width:100%;align-items:center;gap:6px;border:0;background:none;cursor:pointer;padding:0;color:var(--color-warn);font-size:var(--text-sm)}
.bug{display:flex;flex-direction:column;gap:2px;padding:8px 0 4px;border-top:1px solid var(--color-hair);margin-top:6px}
.bug.res{opacity:.55}
.rv-row{display:flex;justify-content:space-between;align-items:center;padding-top:var(--space-2);border-top:1px solid var(--color-hair)}
.checks-bar{height:4px;flex:1;margin-left:12px;border-radius:4px;background:var(--color-paper-4);overflow:hidden}
.checks-bar i{display:block;height:100%;background:var(--color-ok);transform-origin:left;transition:transform 300ms var(--ease-out)}

/* ---------- automation editor ---------- */
.ae{max-width:780px}
.ae-name{font-size:var(--text-lg);margin:var(--space-3) 0 var(--space-6)}
.ae-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:var(--space-2)}
.ae-h h3{font-size:var(--text-md)}
.ae-box{border:1px solid var(--color-hair-2);border-radius:var(--radius-md);padding:10px 12px;margin-bottom:var(--space-2);background:var(--color-paper-2)}
.ae-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:var(--text-sm);padding:3px 0}
.ae-row.sub{padding-left:16px;border-left:1px solid var(--color-hair-2);margin-left:10px}
.tok{border:0;background:var(--color-accent-soft);color:var(--color-accent);border-radius:5px;padding:2px 8px;font-size:var(--text-sm);cursor:pointer;transition:transform var(--dur-press) var(--ease-out)}
.tok:active{transform:scale(.97)}
.tok.ph{color:var(--color-ink-3);background:var(--color-paper-3);min-width:150px;text-align:left}
.tok[aria-invalid="true"]{outline:1px solid var(--color-bad)}
.src{font-size:var(--text-xs);font-weight:600;padding:2px 6px;border-radius:4px;background:var(--color-paper-4)}
.ae-note{display:flex;gap:8px;background:var(--color-paper-3);border-radius:var(--radius-sm);padding:8px 10px;font-size:var(--text-xs);color:var(--color-ink-2);margin:0 0 var(--space-6)}
.ae-box textarea{width:100%;min-height:170px;border:0;background:none;resize:vertical;font-size:var(--text-sm);line-height:1.55;outline:0;margin-top:6px}

/* ---------- responsive ---------- */
@media (max-width: 1024px){
  .session{grid-template-columns:minmax(0,1fr);height:auto}
  .chat{border-right:0;border-bottom:1px solid var(--color-hair);height:70dvh}
  .work{height:70dvh}
  .rv{grid-template-columns:minmax(0,1fr)}
  .rv-side{border-left:0;padding-left:0;position:static}
}
@media (max-width: 768px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(280px,86vw);z-index:40;transform:translateX(-100%);transition:transform 300ms var(--ease-drawer)}
  .app.nav-open .side{transform:none;box-shadow:0 0 0 100vmax oklch(0% 0 0 / .45)}
  .iconbtn.menu-toggle{display:grid}
  .topbar{padding:var(--space-3) var(--space-4)}
  .banner{display:none}
  .page{padding:var(--space-4)}
  .settings,.wiki,.memgrid{grid-template-columns:minmax(0,1fr)}
  .flow{grid-template-columns:minmax(0,1fr)}
  .home{place-items:start center;padding-top:var(--space-10)}
}
@media (pointer: coarse){
  .iconbtn,.send{width:44px;height:44px}
  .btn{min-height:40px}
  .nav a,.side-btn,.sess-item{padding-block:10px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:1ms !important;animation-iteration-count:1 !important;transition-duration:120ms !important;transition-property:opacity,background-color,color,border-color !important}
  .cursor{transition:none !important}
}

<script>
"use strict";
/* ============ tiny helpers ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ico = id => `<svg class="ico"><use href="#i-${id}"/></svg>`;
const uid = () => Math.random().toString(36).slice(2, 8);
const now = () => new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const sleep = ms => new Promise(r => setTimeout(r, ms));
function toast(msg, kind = "") {
  const t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = `${kind === "ok" ? ico("check") : ""}<span>${esc(msg)}</span>`;
  $("#toasts").append(t);
  let timer = setTimeout(close, 3200);
  t.addEventListener("mouseenter", () => clearTimeout(timer));
  t.addEventListener("mouseleave", () => (timer = setTimeout(close, 1600)));
  function close() { t.classList.add("out"); setTimeout(() => t.remove(), 220); }
}

const COLS = [["running", "Running"], ["review", "Waiting for review"], ["done", "Done"]];
function colOf(s) {
  if (["new", "claimed", "running", "resuming", "suspended"].includes(s.status)) return "running";
  if (s.pr && s.pr.state === "open") return "review";
  return "done";
}
function statusText(s) {
  if (s.status === "suspended") return s.detail === "out_of_quota" ? "Out of quota" : "Asleep";
  if (s.detail === "waiting_for_approval") return "Needs your approval";
  if (colOf(s) === "running") return "Working...";
  if (colOf(s) === "review") return s.pr.ci === "running" ? "Waiting for CI" : "PR is ready";
  if (s.status === "exit") return "Terminated";
  return s.ago || "just now";
}
const prLabel = s => s.pr ? s.pr.state[0].toUpperCase() + s.pr.state.slice(1) : "No PR";
function prIco(s) {
  if (!s.pr) return "";
  const st = s.pr.state;
  return `<span class="sep-dot"></span><svg class="ico pr-${st}" aria-label="PR ${st}"><use href="#i-${st === "merged" ? "merge" : "pr"}"/></svg>`;
}
function metaHTML(s) {
  const live = colOf(s) === "running" && s.status !== "suspended" && !s.detail.startsWith("waiting");
  return `<svg class="ico" aria-label="${AGENT_LABEL[s.agent || "cloud"]}"><use href="#i-${AGENT_ICO[s.agent || "cloud"]}"/></svg><span class="${live ? "working" : ""}">${esc(statusText(s))}</span>${prIco(s)}`;

function renderSide() {

/* ============ popover menus ============ */
let openPop = null;
function closePop() { if (openPop) { openPop.remove(); openPop = null; } }
function popover(anchor, html, onPick) {
  closePop();
  const r = anchor.getBoundingClientRect();
  const p = document.createElement("div");
  p.className = "pop"; p.setAttribute("role", "menu"); p.innerHTML = html;
  document.body.append(p);
  const below = r.bottom + p.offsetHeight + 8 < innerHeight;
  const left = Math.min(r.left, innerWidth - p.offsetWidth - 8);
  p.style.left = `${Math.max(8, left)}px`;
  p.style.top = below ? `${r.bottom + 6}px` : `${r.top - p.offsetHeight - 6}px`;
  p.style.setProperty("--origin", below ? "top left" : "bottom left");
  p.addEventListener("click", e => { const b = e.target.closest("button[data-v]"); if (b) { onPick(b.dataset.v); closePop(); } });
  p.querySelector("button")?.focus();
  p.anchor = anchor;
  openPop = p;
}
document.addEventListener("click", e => { if (openPop && !openPop.contains(e.target) && !openPop.anchor?.contains(e.target)) closePop(); });

function wireComposer(id, onSend) {
  const root = $("#" + id), ta = $(`#${id}-ta`), send = root.querySelector(".send");

  ta.addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && ta.value.trim()) { e.preventDefault(); onSend(ta.value.trim()); } });
  send.addEventListener("click", () => ta.value.trim() && onSend(ta.value.trim()));
  root.addEventListener("click", e => {
    const rm = e.target.closest("[data-rm]");
    if (rm) { S.attached = S.attached.filter(r => r !== rm.dataset.rm); vHome(); return; }
    const b = e.target.closest("[data-pop]"); if (!b) return;
    if (b.dataset.pop === "mode") {
      let grp = "", html = "";
      MODES.forEach(m => { if (m.grp !== grp) { grp = m.grp; html += `<div class="grp">${grp}</div>`; } html += `<button data-v="${m.id}" role="menuitemradio" aria-checked="${m.id === S.mode}">${esc(m.label)}<small>${m.id === S.mode ? "✓" : esc(m.desc)}</small></button>`; });
      popover(b, html, v => { S.mode = v; b.textContent = MODES.find(x => x.id === v).label + " ▾"; toast(`Agent: ${MODES.find(x => x.id === v).label}`); });

      const items = ["Upload files", "Upload folder", ...REPOS.map(r => "@" + r), "@Skills", "@Playbooks", "@Plugins", "@Secrets", "@Devin sessions"];
      popover(b, items.map(i => `<button data-v="${esc(i)}">${esc(i)}</button>`).join(""), v => {
        if (v.startsWith("@acme")) { const r = v.slice(1); if (!S.attached.includes(r)) S.attached.push(r); if ($("#" + id + "-att")) vHome(); toast(`Attached ${r}`); }
        else if (v === "@Playbooks") { ta.value = "!implement " + ta.value; ta.dispatchEvent(new Event("input")); }
        else toast(`${v}: simulated picker`);
      });
    } else {
      popover(b, ["!plan", "!implement", "!triage", "!review", "!visual_qa", "!bug_catcher", "/btw (side question)"].map(c => `<button data-v="${c}">${c}</button>`).join(""), v => { ta.value = v.split(" ")[0] + " " + ta.value; ta.focus(); ta.dispatchEvent(new Event("input")); });
    }
  });
}

const PHASES = ["Threat model + matchers", "Investigation (parallel)", "Aggregate & triage", "Runtime validation", "Report"];
function scanHTML(sc) {
  return `<div class="card"><div class="phases">${PHASES.map((p, i) => `<span class="chip ${i < sc.phase ? "ok" : i === sc.phase ? "acc" : ""}">${i + 1}. ${p}</span>`).join("")}</div>

async function runScan() {
  const sc = { phase: 0, signals: 0, cost: "$0.00", agents: Array.from({ length: 12 }, (_, i) => ({ n: i + 1, st: "", found: 0 })), findings: [] };
  S.scans.unshift(sc); vSecurity();
  const rerender = () => location.hash === "#/security" && vSecurity();
  await sleep(1200); sc.signals = 214; sc.phase = 1; sc.cost = "$4.10"; rerender();
  for (let i = 0; i < sc.agents.length; i += 4) {
    sc.agents.slice(i, i + 4).forEach(a => (a.st = "run")); rerender(); await sleep(900);
    sc.agents.slice(i, i + 4).forEach(a => { a.st = "done"; a.found = Math.random() < .3 ? 1 : 0; }); rerender();
  }
  sc.phase = 2; sc.cost = "$38.20"; rerender(); await sleep(1000);
  sc.findings = [
    { title: "Chained auth bypass: org switch + stale session cache", file: "src/auth/session.ts:120", sev: "High", val: "pending", owner: "@auth-team" },
    { title: "SSRF in webhook preview fetch", file: "src/api/webhooks/preview.ts:33", sev: "High", val: "pending", owner: "@platform" },
    { title: "IDOR on invoice download", file: "billing-service/src/invoices.ts:58", sev: "Medium", val: "pending", owner: "@billing" }
  ];
  sc.phase = 3; rerender(); await sleep(1400);
  sc.findings[0].val = "confirmed"; sc.findings[1].val = "confirmed"; sc.findings[2].val = "inconclusive";
  sc.phase = 5; sc.cost = "$61.75"; rerender(); toast("Scan complete · 2 confirmed, 1 needs human review", "ok");
}

    <div class="memgrid"><div class="files">${files.map(f => `<button data-mem="${esc(f)}" aria-current="${f === sel}">${esc(f)}</button>`).join("")}</div><div class="md" id="memBody">${esc(S.memory[sel])}</div></div>`;
}
async function dream(btn) {
  btn.dataset.state = "loading"; btn.textContent = "Dreaming…"; await sleep(1500);
  delete S.memory["scratch/dev-port.md"];
  const sessNotes = Object.keys(S.memory).filter(k => k.startsWith("sessions/"));
  sessNotes.forEach(k => { const topic = /stripe|checkout/i.test(S.memory[k]) ? "testing/checkout.md" : "project/notes.md"; S.memory[topic] = ((S.memory[topic] || "") + "\n" + S.memory[k]).trim(); delete S.memory[k]; });
  S.memory["MEMORY.md"] = S.memory["MEMORY.md"].replace(/\n- Dreamed.*$/s, "") + `\n- Dreamed ${now()}: removed 1 transient note, merged ${sessNotes.length} session notes`;
  S.dreams++; toast("Dreaming: removed 1 stale note, consolidated index", "ok"); vCustomize("memory");
}

/* ============ SETTINGS ============ */
const SETNAV = [["Organization", ["general", "plans", "usage"]], ["Products", ["sessions", "review"]], ["Resources", ["environment", "playbooks", "secrets"]], ["Administration", ["api", "analytics"]]];
function vSettings(tab = "environment") {
  setTitle("Settings", tab);
  const nav = SETNAV.map(([h, items]) => `<div class="h">${h}</div>${items.map(i => `<a href="#/settings/${i}" ${i === tab ? 'aria-current="page"' : ""}>${i === "api" ? "Devin API" : i[0].toUpperCase() + i.slice(1)}</a>`).join("")}`).join("");
  const F = { general: setGeneral, plans: setPlans, usage: setUsage, sessions: setSessions, review: setReviewS, environment: setEnv, playbooks: setPlaybooks, secrets: setSecrets, api: setApi, analytics: setAnalytics }[tab] || setEnv;
  $("#view").innerHTML = `<div class="page"><div class="settings"><nav class="setnav" aria-label="Settings">${nav}</nav><section id="setBody">${F()}</section></div></div>`;
  $("#view").onclick = e => settingsClicks(e, tab);
}
const sw = (k, label, d) => `<div class="setrow"><div><div>${label}</div><div class="d">${d}</div></div><button class="switch" role="switch" aria-checked="${S.settings[k]}" data-sw="${k}" aria-label="${esc(label)}"></button></div>`;
function setGeneral() { return `<h2>General</h2><div class="field" style="max-width:360px"><label for="orgN">Organization name</label><input class="input" id="orgN" value="Acme Platform"></div><p class="small muted">Org ID and SSO/SCIM settings live here on Enterprise.</p>`; }
function setPlans() {
  const P = [["Free", "$0", "Limited Devin usage · Devin Review · DeepWiki"], ["Pro", "$20/mo", "Devin + Desktop quota · pay-as-you-go past quota · Slack, Linear, MCP · SWE-2 · use your ChatGPT plan"], ["Max", "$200/mo", "Higher Devin + Desktop quota"], ["Teams", "$80/mo + $40/seat", "Up to 200 users · sharing · central billing · analytics"], ["Enterprise", "Custom", "SAML/OIDC · VPC / dedicated · ACU billing · account team"]];
  return `<h2>Plans</h2><p class="lede">Prices as listed on devin.ai/pricing (Oct 2026).</p><div class="plans">${P.map(([n, p, d]) => `<div class="card plan ${S.plan === n ? "cur" : ""}"><strong>${n}</strong><div style="font-size:var(--text-xl);font-weight:600;margin:6px 0">${p}</div><p class="small muted">${d}</p>${S.plan === n ? `<span class="chip acc">Current plan</span>` : `<button class="btn sm ${n === "Pro" ? "primary" : ""}" data-plan="${n}">${n === "Enterprise" ? "Contact sales" : "Select"}</button>`}</div>`).join("")}</div>`;
}
function setUsage() { return `<h2>Usage & limits</h2><div class="card" style="max-width:520px"><div class="row" style="justify-content:space-between"><span>Included quota (daily)</span><span class="mono">${Math.round(S.quota.used)}%</span></div><div class="bar"><i style="transform:scaleX(${S.quota.used / 100})"></i></div><div class="row" style="justify-content:space-between;margin-top:12px"><span>On-demand balance</span><span class="mono">$0.00</span></div><p class="xs muted">Sessions pause when the included quota is exceeded and no on-demand balance remains. Waiting for you, waiting on tests and sleeping are not charged.</p><div class="row"><button class="btn" data-reset>Simulate quota refresh</button><button class="btn" data-burn>Simulate 98% used</button></div></div>`; }
function setSessions() { return `<h2>Devin sessions</h2>${sw("memory", "Memory", "Personal notes for each member across sessions")}${sw("computerUse", "Agent computer use", "Mouse, keyboard and screen tools (else browser tools)")}${sw("nativeDeploy", "Enable native deployments", "Allow deploying to the public internet")}${sw("sharePrompt", "Share prompts in PRs", "Include the original prompt in PR descriptions")}${sw("requireMention", "Require @Devin to respond", "Only respond to PR comments that mention @Devin")}${sw("autoReviewer", "Auto-add reviewer", "Add the session creator as reviewer")}
  <div class="setrow"><div><div>Default agent</div><div class="d">For all new sessions</div></div><select class="input" style="width:160px" id="defAgent">${MODES.map(m => `<option value="${m.id}" ${m.id === S.mode ? "selected" : ""}>${m.label}</option>`).join("")}</select></div>
  <div class="setrow"><div><div>Default platform / outpost</div><div class="d">Where sessions run</div></div><select class="input" style="width:200px"><option>Ubuntu</option><option>Windows</option><option>macOS</option><option>Outpost: gpu-lab</option></select></div>
  <div class="setrow"><div><div>Batch limit</div><div class="d">Max sessions per batch (1–500)</div></div><input class="input mono" style="width:90px" type="number" min="1" max="500" value="${S.settings.batchLimit}" id="batch"></div>`; }
function setReviewS() { return `<h2>Devin Review</h2><p class="lede">Post findings as PR comments by category, post a CI check per review, auto-review enrollments, per-PR spend cap.</p><div class="setrow"><div><div>Per-PR on-demand spend limit</div><div class="d">Stops auto-reviewing once exceeded. Default $5.</div></div><input class="input mono" style="width:90px" value="5"></div><div class="setrow"><div><div>Rule files</div><div class="d">Read by proximity to changed files</div></div><code>**/REVIEW.md</code></div>`; }
function setEnv() {
  const sn = S.snapshot;
  return `<h2>Environment</h2><p class="lede">Blueprint → build → snapshot. Every session boots a fresh copy of the snapshot; changes never write back.</p>
  <div class="tabs"><button aria-selected="true">Blueprints</button><button disabled>Snapshots</button><button disabled>Outposts</button></div>
  <div class="field"><label for="bp">Organization blueprint (YAML)</label><textarea class="input mono" id="bp" rows="14" spellcheck="false">${esc(S.blueprint)}</textarea><span class="err" id="bpErr" hidden></span></div>
  <div class="row" style="flex-wrap:wrap"><button class="btn primary" id="build">Save & build snapshot</button><span class="chip ${sn.status === "ready" ? "ok" : sn.status === "failed" ? "bad" : "acc"}" id="snapChip">snapshot ${sn.status} · ${sn.built}</span></div>
  ${sn.log.length ? `<div class="term" style="margin-top:12px;border-radius:8px;min-height:0">${sn.log.map(l => `<span class="${l[1]}">${esc(l[0])}</span>`).join("\n")}</div>` : ""}`;
}
async function buildSnapshot() {
  const v = $("#bp").value;
  if (!/^initialize:/m.test(v)) { $("#bp").setAttribute("aria-invalid", "true"); const er = $("#bpErr"); er.hidden = false; er.textContent = "Blueprint needs an `initialize:` section"; return; }
  S.blueprint = v; const sn = S.snapshot; sn.status = "building"; sn.built = "now"; sn.log = [];
  const L = [["$ clone acme/platform acme/web", "p"], ["initialize: corepack enable && nvm install 20", ""], ["maintenance: pnpm install --frozen-lockfile", ""], ["  + 1,284 packages in 21.4s", "g"], ["post-build: validation passed", "g"], ["snapshot saved · org/acme@" + uid(), "g"]];
  for (const l of L) { sn.log.push(l); if (location.hash === "#/settings/environment") vSettings("environment"); await sleep(450); }
  sn.status = "ready"; sn.built = "today " + now(); if (location.hash === "#/settings/environment") vSettings("environment"); toast("Snapshot ready: new sessions boot from it", "ok");
}
const PLAYBOOKS = [["Linear: Implement", "!implement"], ["Linear: Plan", "!plan"], ["Linear: Triage", "!triage"], ["Linear: Code Review", "!review"], ["Visual QA", "!visual_qa"], ["Bug Catcher", "!bug_catcher"], ["Java 8 → 11", "!java_8_to_11"], ["Python 3.8 → 3.13", "none"], ["Rails 7.0 → 7.1", "none"], ["Checkmarx SAST Resolution", "none"], ["Roast My Commits", "!roast"]];
function setPlaybooks() { return `<h2>Playbooks</h2><p class="lede">Reusable system prompts. Invoke with a <code>!macro</code> in chat, Slack, or as a Linear label.</p><div class="tablewrap"><table class="t"><thead><tr><th>Name</th><th>Macro</th><th>By</th><th></th></tr></thead><tbody>${PLAYBOOKS.map((p, i) => `<tr><td>${p[0]}</td><td class="mono">${p[1]}</td><td class="small muted">Cognition Team</td><td><button class="btn sm" data-pb="${i}">View</button></td></tr>`).join("")}</tbody></table></div>`; }
function setSecrets() { return `<h2>Secrets</h2><p class="lede">Reference as <code>$NAME</code>. Org / personal / repo / session scope. OIDC to cloud providers means no stored credentials. Never baked into snapshots.</p><div class="row" style="max-width:520px"><label class="sr" for="secN">Secret name</label><input class="input mono" id="secN" placeholder="STRIPE_TEST_KEY"><button class="btn primary" id="secAdd">Add secret</button></div><div id="secList" class="stack" style="margin-top:12px">${(S.secrets || []).map(n => `<div class="row small"><code>$${esc(n)}</code><span class="chip">organization</span><span class="xs muted">value hidden</span></div>`).join("")}</div>`; }
function setApi() { return `<h2>Devin API</h2><p class="lede">v3: <code>POST /v3/organizations/{org}/sessions</code>. Auth with role-scoped service users or personal access tokens.</p><div class="md">curl -X POST https://api.devin.ai/v3/organizations/$ORG/sessions \\\n  -H "Authorization: Bearer $DEVIN_API_KEY" \\\n  -d '{"prompt":"Fix the flaky checkout test","repos":["acme/platform"],"devin_mode":"fusion","max_acu_limit":10,"structured_output_schema":{"type":"object","properties":{"pr_url":{"type":"string"}}}}'</div><p class="small muted" style="margin-top:12px">Status values: new → claimed → running → exit | error | suspended | resuming. Details include waiting_for_user, waiting_for_approval, out_of_quota, inactivity.</p>`; }
function setAnalytics() {
  const done = S.sessions.filter(s => s.status === "finished").length, prs = S.sessions.filter(s => s.pr).length;
  return `<h2>Analytics</h2><p class="lede">Live from this mockup's simulated sessions.</p><div class="grid2"><div class="card"><div class="xs muted">Sessions</div><div style="font-size:var(--text-2xl);font-weight:600">${S.sessions.length}</div></div><div class="card"><div class="xs muted">Finished</div><div style="font-size:var(--text-2xl);font-weight:600">${done}</div></div><div class="card"><div class="xs muted">PRs opened</div><div style="font-size:var(--text-2xl);font-weight:600">${prs}</div></div><div class="card"><div class="xs muted">ACUs used</div><div style="font-size:var(--text-2xl);font-weight:600">${S.sessions.reduce((a, s) => a + s.acu, 0).toFixed(1)}</div></div></div>`;
}
function settingsClicks(e, tab) {
  const t = e.target.closest("[data-sw]"); if (t) { const k = t.dataset.sw; S.settings[k] = !S.settings[k]; t.setAttribute("aria-checked", S.settings[k]); toast("Saved"); return; }
  if (e.target.id === "build") buildSnapshot();
  const pl = e.target.closest("[data-plan]"); if (pl) { if (pl.dataset.plan === "Enterprise") { toast("Sales contact: simulated"); return; } S.plan = pl.dataset.plan; S.quota.used = 0; toast(`Switched to ${S.plan} (simulated, no payment)`, "ok"); vSettings("plans"); renderSide(); }
  if (e.target.matches("[data-reset]")) { S.quota.used = 0; renderSide(); vSettings("usage"); }
  if (e.target.matches("[data-burn]")) { S.quota.used = 98; renderSide(); vSettings("usage"); }
  const pb = e.target.closest("[data-pb]"); if (pb) openDrawer(PLAYBOOKS[pb.dataset.pb][0], pb.dataset.pb === "0" ? IMPLEMENT : `<p class="small muted">Sections: Overview · What's needed from user · Procedure · Specifications · Advice · Forbidden actions.</p>`);
  if (e.target.id === "secAdd") { const n = $("#secN").value.trim(); if (!/^[A-Z][A-Z0-9_]*$/.test(n)) { $("#secN").setAttribute("aria-invalid", "true"); toast("Use UPPER_SNAKE_CASE"); return; } (S.secrets = S.secrets || []).push(n); vSettings("secrets"); toast("Secret added", "ok"); }
  if (tab === "sessions") { const d = $("#defAgent"); d && (d.onchange = () => { S.mode = d.value; toast("Default agent updated"); }); }
}
const IMPLEMENT = `<p class="small muted">Summarized from the system playbook seen in the logged-in app.</p>
<h3 class="small">1 · Disambiguation</h3><ul class="small"><li>Fetch ticket via Linear MCP; read every comment and attachment.</li><li>Ask the Devin MCP / DeepWiki about all possibly relevant repos.</li><li>Mine past tickets, related commits/PRs, linked docs.</li><li>Resolve jargon yourself; don't block on preferences. Ask only on critical ambiguity, then stop and wait.</li></ul>
<h3 class="small">2 · Implementation</h3><ul class="small"><li>Set ticket In Progress; trace data/control flow; map callers/callees.</li><li>Branch → implement → verify types with LSP (goto_definition / references / hover).</li><li>Tests, lint, run tests; commit referencing the ticket; open PR; link it; status For Review.</li></ul>
<h3 class="small">3 · Iteration</h3><ul class="small"><li>Self-review the diff vs ticket + checklist (no dead code, no needless abstractions, backwards compatible).</li><li>Wait for CI; read review-bot comments even when their check shows "passed".</li><li>Resolve human comments; triage bot feedback; loop until clean; post "ready for human review".</li></ul>`;

/* ============ drawer + palette ============ */
let lastFocus = null;
function openDrawer(title, html) {
  closeDrawer(); lastFocus = document.activeElement;
  document.body.insertAdjacentHTML("beforeend", `<div class="drawer-bg" data-close></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h3>${esc(title)}</h3><button class="iconbtn" data-close aria-label="Close">${ico("x")}</button></header><div class="body">${html}</div></aside>`);
  $(".drawer [data-close]").focus();
  document.querySelectorAll("[data-close]").forEach(x => x.addEventListener("click", closeDrawer));
}
function closeDrawer() { document.querySelectorAll(".drawer,.drawer-bg").forEach(x => x.remove()); lastFocus?.focus?.(); }
function openPalette() {
  if ($(".palette-bg")) return;
  const items = [["New session", "#/home"], ["Automations", "#/automations"], ["Security", "#/security"], ["Review", "#/review"], ["Wiki", "#/wiki"], ["Customize › Memory", "#/customize/memory"], ["Settings › Environment", "#/settings/environment"], ["Settings › Plans", "#/settings/plans"], ...S.sessions.map(s => ["Session: " + s.prompt, "#/session/" + s.id])];
  document.body.insertAdjacentHTML("beforeend", `<div class="palette-bg"><div class="palette" role="dialog" aria-label="Command palette"><input placeholder="Start session with a prompt, or jump to…" aria-label="Command"><div class="res" role="listbox"></div></div></div>`);
  const bg = $(".palette-bg"), inp = bg.querySelector("input"), res = bg.querySelector(".res"); let sel = 0, list = [];
  const draw = () => { const q = inp.value.toLowerCase(); list = items.filter(i => i[0].toLowerCase().includes(q)); if (q) list.unshift(["Start session: " + inp.value, "start"]); sel = Math.min(sel, Math.max(0, list.length - 1)); res.innerHTML = list.map((i, k) => `<button role="option" aria-selected="${k === sel}" data-k="${k}">${esc(i[0])}</button>`).join(""); };
  const pick = k => { const it = list[k]; if (!it) return; bg.remove(); if (it[1] === "start") { startSession(inp.value); } else go(it[1]); };
  inp.addEventListener("input", () => { sel = 0; draw(); });
  inp.addEventListener("keydown", e => { if (e.key === "ArrowDown") { sel = Math.min(sel + 1, list.length - 1); draw(); e.preventDefault(); } if (e.key === "ArrowUp") { sel = Math.max(sel - 1, 0); draw(); e.preventDefault(); } if (e.key === "Enter") pick(sel); });
  res.addEventListener("click", e => { const b = e.target.closest("[data-k]"); b && pick(+b.dataset.k); });
  bg.addEventListener("click", e => e.target === bg && bg.remove());
  draw(); inp.focus();
}
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openPalette(); }
  if (e.key === "Escape") { closePop(); closeDrawer(); $(".palette-bg")?.remove(); $("#app").classList.remove("nav-open"); }
});
document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]"); if (!a) return;
  if (a.dataset.act === "palette") openPalette();
  if (a.dataset.act === "nav") $("#app").classList.toggle("nav-open");
  if (a.dataset.act === "voice") toast("Voice input: simulated");
});

seed(); route();
</script>
